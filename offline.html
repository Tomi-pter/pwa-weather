<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <style>
      html {
        height: 100%;
      }

      body {
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
        background-color: blue;
      }

      .city {
        background-color: white;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
        width: 80%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .city-name {
        font-size: 24px;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div class="city">
      <h2 class="city-name">Weather App</h2>
      <p>You are currently offline.</p>
    </div>
  </body>
</html>
